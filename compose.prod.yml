# EC2: app only. DB = RDS; all secrets from AWS Secrets Manager via instance role.
services:
  app:
    build: .
    image: htzone-shop:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      AWS_SECRET_ID: ${AWS_SECRET_ID:-htzone/prod}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - app-storage:/var/www/html/storage/framework/cache
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  app-storage:
