# Local development / demo: app + MySQL 8.4.
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:w2wwwaAhIIr6b6tCNo7SzOHgMwf54B67E9ndyrAYjn4=}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: htzone
      DB_USERNAME: htzone
      DB_PASSWORD: htzone
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      HF_EMBEDDING_MODEL: intfloat/multilingual-e5-small
      HF_ENDPOINT: http://tei/embed
      HF_TIMEOUT: 10
    depends_on:
      mysql:
        condition: service_healthy

  # Self-hosted embeddings (Hugging Face Text Embeddings Inference, CPU). Same model
  # and API shape as the hosted HF endpoint, no token or credits. ~1.1 GB RAM
  # (one tokenizer worker: each extra worker loads its own ~300 MB tokenizer copy).
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "intfloat/multilingual-e5-small", "--max-client-batch-size", "64", "--tokenization-workers", "1", "--max-batch-tokens", "4096"]
    restart: unless-stopped
    volumes:
      - tei-models:/data

  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: htzone
      MYSQL_USER: htzone
      MYSQL_PASSWORD: htzone
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_HOST_PORT:-33061}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
  tei-models:
